<!DOCTYPE HTML>
<html>


<head>
	<title>Minesweeper infinite</title>
	<link rel="stylesheet" href="ms.css">
	<script>
		let query = new URLSearchParams(window.location.search);

		var CHANCE = +(query.get('chance')) ?? 0.33;
	</script>
	<script src="msgame.js" type="text/javascript"></script>
</head>

<body>
	<div style="position:fixed; left:0; top:0; z-index:100; border: 2px solid red; padding: 2px">
		<h1>Minesweeper Infinite</h1>
		<h2>Score: <span id="scorespan">0</span></h2>
		<h3>
			<a
				href="javascript:(function(){var e=document.getElementById('maindiv'); e.style.left=parseInt(e.style.left)+100+'px'; e.style.top=parseInt(e.style.top)+100+'px';})()">Scroll
				up</a> |
			<a href="javascript:viewInstructions();">Instructions</a> |
			<a href="?">[NEW GAME]</a><br>
		</h3>
		<h3 style="display:none" id="gameover">Game over.</h3>
	</div>
	<div id="maindiv" style="position:absolute; left:0; top:0; width:100%; height:100%">
		<script>
			if (!query.get('chance')) {
				document.write(`
		<table style="width:100%; height:100%">
			<tr>
				<td style="width:100%; height:100%; vertical-align:middle; text-align:center">
					<div style="margin: 0 auto 0 auto; width:640px; height:auto; border:2px solid red">
						<h1>Choose your skill</h1>
						<ul>
							<li><a href="?chance=0.16">Easy</a></li>
							<li><a href="?chance=0.2">Normal</a></li>
							<li><a href="?chance=0.25">Hard</a></li>
							<li><a href="?chance=0.33">Expert</a></li>
							<li><a href="?chance=0.5">Wizard</a></li>
						</ul>
					</div>
				</td>
			</tr>
		</table>
			`);
			}
			else {
				initGame();
			}
		</script>
	</div>
</body>

</html>
